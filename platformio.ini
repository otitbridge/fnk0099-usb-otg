[platformio]
default_envs = fnk0099-host

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
platform_packages = platformio/framework-espidf@3.50500.0
board_upload.flash_size = 16MB
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 460800

[env:fnk0099-host]

[env:fnk0099-hid]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hid.defaults"

[env:fnk0099-msc]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.msc.defaults"
